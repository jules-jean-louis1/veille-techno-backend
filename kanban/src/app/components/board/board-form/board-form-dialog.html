<form (ngSubmit)="onSubmit()">
  <h2>Créer un tableau</h2>
  <mat-dialog-content>
    <mat-form-field>
      <mat-label>Titre du tableau</mat-label>
      <input matInput [(ngModel)]="name" name="name" placeholder="Nom" required />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Description du tableau</mat-label>
      <input matInput [(ngModel)]="description" name="description" placeholder="description" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button matButton (click)="onNoClick()">Fermer</button>
    <button matButton [mat-dialog-close]="onSubmit()" cdkFocusInitial>Créer</button>
  </mat-dialog-actions>
</form>
