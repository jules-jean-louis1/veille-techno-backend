<p>Bienvenue!</p>
<ng-container [ngSwitch]="showForm">
    <app-login-form *ngSwitchCase="'login'"></app-login-form>
    <app-register-form  *ngSwitchCase="'register'"></app-register-form>
<button (click)="toggleForm()">
  {{ showForm === 'login' ? "Pas encore de compte ? S'inscrire" : "Déjà un compte ? Se connecter" }}
</button>
